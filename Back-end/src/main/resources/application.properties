spring.application.name=Chatop

spring.datasource.url=jdbc:mysql://localhost:3306/chatop?serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

app.secret-key=${JWT_SECRET_KEY}
app.token-expiration=${JWT_TOKEN_EXPIRATION}

# Images storage configuration
app.images.directory=src/main/resources/static/images


